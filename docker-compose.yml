version: '3.8'

# =============================================================================
# Hamdard AI Platform — Docker Compose Stack
# Services: Next.js App, PostgreSQL 16, Redis 7
# =============================================================================

services:
  # Next.js Enterprise AI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # ── Secrets: supply via .env or runtime injection ──────────────────────
      # Never hardcode production values here. Copy .env.compose.example and
      # populate it, then run: docker compose --env-file .env.compose up
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:changeme@postgres:5432/hamdard_ai?schema=public}
      - AUTH_SECRET=${AUTH_SECRET:-CHANGE_ME_IN_PRODUCTION_USE_openssl_rand_-hex_32}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  # PostgreSQL 16 Enterprise Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hamdard_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-hamdard_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 Cache & Rate Limiting Engine
  redis:
    image: redis:7-alpine
    container_name: hamdard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
